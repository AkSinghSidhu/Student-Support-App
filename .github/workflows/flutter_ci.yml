name: build-and-test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-version:
    name: Check Version & Tag
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
      apk_name: ${{ steps.version.outputs.apk_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Extract and Check Version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
          
          # Auto-increment build number from total commit count
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION_CODE=$COMMIT_COUNT
          
          # Include build number in tag so every commit gets a unique release
          TAG="v$VERSION_NAME-b$VERSION_CODE"
          
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists. Skipping build and release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "New commit detected. Will build and release $TAG."
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi
          
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "apk_name=StudentSupportApp-v$VERSION_NAME-b$VERSION_CODE.apk" >> $GITHUB_OUTPUT
          
          echo "--- Version Info ---"
          echo "Semver: $VERSION_NAME"
          echo "Build number (commit count): $VERSION_CODE"
          echo "Tag: $TAG"

  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0

      - name: Setup Java
        uses: actions/setup-java@v5.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5.0.0
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4.6.1
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 14

  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    needs: [check-version, analyze-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-version.outputs.should_release == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5.0.0
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed release APK
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          flutter build apk --release \
            --build-number=$COMMIT_COUNT \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Check APK size
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH")
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $APK_SIZE_BYTES / 1048576}")
          echo "📦 APK Size: ${APK_SIZE_MB} MB"
          
          MAX_SIZE_MB=80
          MAX_SIZE_BYTES=$((MAX_SIZE_MB * 1048576))
          if [ "$APK_SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
            echo "❌ FAILED: APK size ${APK_SIZE_MB}MB exceeds limit of ${MAX_SIZE_MB}MB"
            exit 1
          else
            echo "✅ PASSED: APK size ${APK_SIZE_MB}MB is under ${MAX_SIZE_MB}MB limit"
          fi

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/${{ needs.check-version.outputs.apk_name }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: ${{ needs.check-version.outputs.apk_name }}
          path: build/app/outputs/flutter-apk/${{ needs.check-version.outputs.apk_name }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: "Student Support App v${{ needs.check-version.outputs.version_name }} (Build ${{ needs.check-version.outputs.version_code }})"
          body: |
            ## Student Support App v${{ needs.check-version.outputs.version_name }} (Build ${{ needs.check-version.outputs.version_code }})

            **Build Number:** ${{ needs.check-version.outputs.version_code }}
            **Commit SHA:** ${{ github.sha }}

            ### How to install
            1. Download `${{ needs.check-version.outputs.apk_name }}` below
            2. Transfer to your Android phone
            3. Tap to install
            4. Updates directly over old version ✅

            ### Release Notes
            ${{ github.event.head_commit.message }}
          files: |
            build/app/outputs/flutter-apk/${{ needs.check-version.outputs.apk_name }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}